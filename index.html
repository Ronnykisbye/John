<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3b60">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Overdragelse">
  <title>Maskinoverdragelse</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" class="brand-icon">
      <div>
        <h1>Maskinoverdragelse</h1>
        <p>Sikker og tydelig overdragelse mellem operatører</p>
      </div>
    </div>
    <button id="installBtn" class="secondary" hidden>Installer app</button>
  </header>

  <main class="shell">
    <section class="card">
      <div class="section-title">
        <h2>Ny overdragelse</h2>
        <span id="saveStatus" class="status-pill">Klar</span>
      </div>

      <form id="handoverForm" novalidate>
        <div class="form-grid">
          <label class="field">
            <span>1. Maskinnummer <b>*</b></span>
            <input id="machineNumber" name="machineNumber" type="text" inputmode="text" placeholder="Fx M-1042" required autocomplete="off">
          </label>

          <label class="field">
            <span>2. Hvordan har maskinen kørt? <b>*</b></span>
            <select id="machineStatus" name="machineStatus" required>
              <option value="">Vælg status</option>
              <option value="A">A. Kørt perfekt</option>
              <option value="B">B. Kørt, men med fejl</option>
              <option value="C">C. Har en fejl – tekniker tilkaldt</option>
            </select>
          </label>

          <label id="errorField" class="field full hidden">
            <span>Beskriv fejl / observationer <b>*</b></span>
            <textarea id="errorDescription" name="errorDescription" rows="4" maxlength="800" placeholder="Skriv kort hvad der er sket, hvad der er observeret, og hvad der eventuelt allerede er gjort."></textarea>
            <small><span id="charCount">0</span>/800 tegn</small>
          </label>

          <label class="field">
            <span>3. Er i gang med batch <b>*</b></span>
            <select id="batch" name="batch" required>
              <option value="">Vælg batch</option>
              <option>Batch 0001</option>
              <option>Batch 0002</option>
              <option>Batch 0003</option>
              <option>Batch 0004</option>
              <option>Batch 0005</option>
            </select>
          </label>

          <label class="field">
            <span>4. Nuværende ordre <b>*</b></span>
            <input id="orderNumber" name="orderNumber" type="text" placeholder="Fx ORD-123456-A" required autocomplete="off">
          </label>

          <label class="field">
            <span>5. Ordre startet kl. <b>*</b></span>
            <input id="orderStart" name="orderStart" type="time" required>
          </label>

          <label class="field">
            <span>6. Ordre forventes færdig kl. <b>*</b></span>
            <input id="orderEnd" name="orderEnd" type="time" required>
          </label>

          <label class="field">
            <span>7. Afgående operatør <b>*</b></span>
            <select id="outgoingOperator" name="outgoingOperator" required></select>
          </label>

          <label class="field">
            <span>8. Tilkommende operatør <b>*</b></span>
            <select id="incomingOperator" name="incomingOperator" required></select>
          </label>
        </div>

        <div id="formMessage" class="message" role="alert" hidden></div>

        <div class="actions">
          <button type="button" id="resetBtn" class="secondary">Nulstil</button>
          <button type="submit" class="primary">Gem overdragelse</button>
        </div>
      </form>
    </section>

    <section class="card history-card">
      <div class="section-title history-head">
        <div>
          <h2>Seneste overdragelser</h2>
          <p>Gemmes kun på denne enhed i denne prototype.</p>
        </div>
        <button id="clearHistoryBtn" class="ghost">Slet historik</button>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>
  </main>

  <footer>
    <span>Prototype • PWA • Offline-klar</span>
  </footer>

  <script src="app.js" defer></script>
</body>
</html>
